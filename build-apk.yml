name: Construir APK Fútbol Táctico

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -name 'FutbolTactico_Android_v1*.zip' -print -quit)
          unzip -o "$ZIP"

      - name: Construir APK
        working-directory: FutbolTactico
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FutbolTactico-APK
          path: FutbolTactico/app/build/outputs/apk/debug/app-debug.apk
